# Docker profile: the application container reuses databases running on the host.
server.port=${SERVER_PORT:8181}
server.address=0.0.0.0

spring.datasource.druid.initialSize=1
spring.datasource.druid.minIdle=1
spring.datasource.druid.maxActive=${DB_POOL_MAX_ACTIVE:8}
spring.datasource.druid.maxWait=3000
spring.datasource.druid.timeBetweenEvictionRunsMillis=300000
spring.datasource.druid.minEvictableIdleTimeMillis=600000
spring.datasource.druid.validationQuery=SELECT 1
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false
spring.datasource.druid.keepAlive=false
spring.datasource.druid.poolPreparedStatements=false
spring.datasource.druid.filters=stat,wall,slf4j
spring.datasource.druid.connectionProperties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.main.lazy-initialization=false
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:3000ms}
spring.redis.lettuce.shutdown-timeout=${REDIS_SHUTDOWN_TIMEOUT:100ms}
