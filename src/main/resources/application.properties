# Shared application settings. Secrets and service endpoints are supplied by environment variables.
spring.application.name=${SPRING_APPLICATION_NAME:ablaze}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Database
spring.datasource.username=${DB_USERNAME:ablaze}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ablaze?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=5000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# Redis
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.username=${REDIS_USERNAME:default}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT:3000ms}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}

# Mail
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=utf-8
spring.mail.protocol=smtp
spring.mail.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:true}

# Payment and external integrations
alipay.appId=${ALIPAY_APP_ID:}
alipay.appPrivateKey=${ALIPAY_PRIVATE_KEY:}
alipay.alipayPublicKey=${ALIPAY_PUBLIC_KEY:}
alipay.notifyUrl=${ALIPAY_NOTIFY_URL:}
payment.secret-key=${PAYMENT_SECRET_KEY:}
payment.sign-field=${PAYMENT_SIGN_FIELD:sign}
# Boot 2.7 严格解析下 ${PAY_API_URL:} 自引用会报 Circular placeholder，
# 直接由 @Value("${PAY_API_URL:}") 从环境变量取值，不再在此定义同名属性

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.enabled=${JWT_ENABLED:true}

# RabbitMQ（P0 减重已移除 amqp starter，配置随注释；如未来重引入请恢复此处与 pom）
# spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
# spring.rabbitmq.port=${RABBITMQ_PORT:5672}
# spring.rabbitmq.username=${RABBITMQ_USERNAME:}
# spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
