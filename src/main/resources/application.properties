# Runtime defaults
server.port=${SERVER_PORT:8181}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.jmx.enabled=false
management.endpoints.jmx.exposure.exclude=*
spring.application.admin.enabled=false
management.jmx.enabled=false
com.sun.management.jmxremote=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.main.banner-mode=off
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
user.code.format=${USER_CODE_FORMAT:【ROGINSHIN】%s为本次验证码，请在5分钟内完成验证。为保证账号安全，请勿泄漏。}
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.alibaba.druid=WARN
logging.level.com.ld.poetry=${LOG_LEVEL:INFO}
logback.rootDir=${LOG_DIR:/app/logs}
logback.fileInfoLog.maxFileSize=${LOG_MAX_FILE_SIZE:50MB}
logback.fileInfoLog.maxHistory=${LOG_MAX_HISTORY:7}
logback.fileInfoLog.totalSizeCap=${LOG_TOTAL_SIZE_CAP:500MB}
logback.fileErrorLog.maxFileSize=${LOG_MAX_FILE_SIZE:50MB}
logback.fileErrorLog.maxHistory=${LOG_MAX_HISTORY:7}
logback.fileErrorLog.totalSizeCap=${LOG_TOTAL_SIZE_CAP:500MB}
